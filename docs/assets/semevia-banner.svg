<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="SEMEVIA: vehicle identity through evidence">
  <title>SEMEVIA: vehicle identity through evidence</title>
  <rect width="1280" height="360" fill="#f4f1ea"/>
  <path d="M0 359.5h1280" stroke="#dcd6c8"/>
  <!-- mark: two detection-box corners frame a V (vehicle, verified) -->
  <g transform="translate(96 84) scale(3.7)" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M6.5 18V6.5H18M41.5 30v11.5H30" stroke="#15171a" stroke-width="4"/>
    <path d="M14 15.5 24 34l10-18.5" stroke="#d9480f" stroke-width="5"/>
  </g>
  <!-- wordmark and line -->
  <text x="330" y="168" fill="#15171a" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="16">SEME<tspan fill="#d9480f">V</tspan>IA</text>
  <text x="333" y="214" fill="#4a4d52" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26">Vehicle identity through evidence</text>
  <!-- pipeline strip -->
  <g font-family="Consolas, SF Mono, Menlo, monospace" font-size="15" letter-spacing="2" fill="#4a4d52">
    <text x="333" y="276">01 DETECT</text>
    <text x="523" y="276">02 IDENTIFY</text>
    <text x="733" y="276">03 EVIDENCE</text>
  </g>
  <g stroke="#15171a" stroke-width="1.5">
    <path d="M333 290h150M523 290h170M733 290h160"/>
  </g>
  <path d="M893 290h0" stroke="#d9480f" stroke-width="1.5"/>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#74777c">
    <text x="333" y="314">YOLO11n vehicle box</text>
    <text x="523" y="314">196 make / model / year</text>
    <text x="733" y="314">calibrated Passport</text>
  </g>
  <rect x="1046" y="64" width="146" height="34" rx="4" fill="#15171a"/>
  <text x="1119" y="87" text-anchor="middle" fill="#f4f1ea" font-family="Consolas, SF Mono, Menlo, monospace" font-size="14" letter-spacing="2">PS5 · T35</text>
</svg>

# Second training recipe (r2): full-network fine-tuning of EfficientNet-B0.
# Why: in run effb0_r1 (configs/train.yaml, last stage only, 6 epochs) tune top-1 was still rising at the last
# epoch (reports/training/effb0_r1_summary.json), so training only the last stage looked like the limit. Everything below is decided
# from train/tune behaviour only; the test split is evaluated once for the bundle built on this run and reported
# next to r1 (see docs/timeline.md). Same data, crop, input size and normalisation as r1, so the inference
# pipeline is unchanged.
run_name: effb0_r2
backbone: efficientnet_b0
weights: IMAGENET1K_V1
num_classes: 196
input_size: 224
crop:
  source: annotation_box_with_jitter
  margin: 0.05
  jitter: 0.08
normalize:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
augment:
  hflip: 0.5
  brightness: 0.2
  contrast: 0.2
  blur_p: 0.1
stages:
  - name: head
    trainable: [classifier]
    epochs: 2
    lr: 0.001
  - name: full_finetune               # all pretrained blocks unfrozen (includes features.7 and features.8)
    trainable: [classifier, features]
    epochs: 24
    lr_head: 0.002
    lr_backbone: 0.0005
    schedule: cosine
optimizer: adamw
weight_decay: 0.0001
label_smoothing: 0.1                 # training loss only; evaluation uses plain cross-entropy
batch_size: 32
early_stopping_patience: 6
num_workers: 4
seed: 20261107
amp: true
checkpoint:
  dir_env: SEMEVIA_ARTIFACT_STORE
  save_every_epoch: [last, best]
  time_cap_minutes: 120
